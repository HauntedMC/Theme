  <text x="52" y="133" fill="#94A3B8" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">ORIGINAL ROLES</text>
  <text x="532" y="133" fill="#94A3B8" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700">SOURCE AND DETAIL ROLES</text>
