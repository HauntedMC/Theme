<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535" role="img" aria-labelledby="title description">
  <title id="title">HauntedMC colour palette</title>
  <desc id="description">The seven original colours and six added colours displayed as labelled text and swatches on a dark chat background.</desc>
  <rect width="1000" height="535" rx="20" fill="#10141F"/>
  <rect x="24" y="24" width="952" height="487" rx="16" fill="#171D2B" stroke="#364154"/>
