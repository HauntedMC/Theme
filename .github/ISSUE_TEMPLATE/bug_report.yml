name: Bug report
description: Report a bug or unexpected behaviour
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please provide enough detail for maintainers to reproduce the problem quickly.
  - type: checkboxes
    id: precheck
    attributes:
      label: Pre-check
      options:
        - label: I searched existing issues and tested the latest release.
          required: true
        - label: I removed secrets and sensitive data from logs and snippets.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the relevant Java or MiniMessage usage and the observed result.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: theme_version
    attributes:
      label: HauntedMC Theme version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: featureframework_version
    attributes:
      label: FeatureFramework version (if applicable)
      placeholder: 1.5.0
  - type: input
    id: platform
    attributes:
      label: Java and platform version
      placeholder: Java 25; Paper 26.2 or Velocity 4.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Palette API
        - FeatureFramework adapter
        - Publishing / Maven metadata
        - Build / CI
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack trace (optional)
      render: shell
