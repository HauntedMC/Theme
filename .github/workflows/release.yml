name: Release Theme Modules

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: theme-release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  palette:
    uses: ./.github/workflows/release-module.yml
    with:
      module: hauntedmc-theme-palette
      tag_prefix: palette-
      event_before: ${{ github.event.before }}
    secrets: inherit
  adapter:
    needs: palette
    uses: ./.github/workflows/release-module.yml
    with:
      module: hauntedmc-theme-featureframework
      tag_prefix: adapter-
      event_before: ${{ github.event.before }}
    secrets: inherit
